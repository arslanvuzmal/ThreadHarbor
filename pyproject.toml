[project]
name = "whatsapp-support-bot"
version = "0.1.0"
description = "Phase 01 WhatsApp webhook scaffolding and support bot foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "redis>=5.0.0",
    "langfuse>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "openai>=1.50.0",
    "qdrant-client>=1.11.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "PTH", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_errors = true
